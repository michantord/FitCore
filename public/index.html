<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitCore | Login Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>FitCore Admin</h1>
      <p>Panel de Administración Core</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" required placeholder="admin@fitcore.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" required placeholder="Min 8 chars, 1 num, 1 especial" autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Ingresar al Sistema</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');

    // Verificar si ya hay sesión iniciada (simulado con localStorage)
    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        // Enviar datos al backend (Aquí ocurre la validación en backend del dato sensible)
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          // Si la validación del backend falla (ej. contraseña débil o incorrecta)
          alertBox.textContent = data.error || 'Error de autenticación';
          alertBox.className = 'alert error';
        } else {
          // Éxito en la autenticación
          alertBox.textContent = 'Autenticación exitosa. Redirigiendo...';
          alertBox.className = 'alert success';
          localStorage.setItem('token', data.token); // Simulamos guardado de token
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1000);
        }
      } catch (error) {
        alertBox.textContent = 'Error de conexión con el servidor.';
        alertBox.className = 'alert error';
      }
    });
  </script>
</body>
</html>

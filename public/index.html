<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIT</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Efectos hover para el enlace de alternancia */
    #toggleAuthLink:hover {
      color: var(--c-volt-hover) !important;
      text-decoration: underline !important;
    }
  </style>
</head>

<body>
  <div class="panel">
    <div class="auth-header">
      <h1>Fit<span>Core</span></h1>
      <p>Inicio de Sesión</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" required placeholder="admin@fitcore.com"
          autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" required placeholder="Min 8 chars, 1 num, 1 especial"
          autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="submitBtn">Ingresar al Sistema</button>
    </form>

    <div class="auth-footer" style="text-align: center; margin-top: 1.5rem;">
      <p id="footerLogin" style="font-family: var(--font-sans); font-size: 14px; color: var(--c-muted);">
        ¿No tienes una cuenta? <a href="#" id="toSignupLink" style="color: var(--c-volt); text-decoration: none; font-weight: 500; transition: color 0.2s;">Regístrate aquí</a>
      </p>
      <p id="footerSignup" style="font-family: var(--font-sans); font-size: 14px; color: var(--c-muted); display: none;">
        ¿Ya tienes una cuenta? <a href="#" id="toLoginLink" style="color: var(--c-volt); text-decoration: none; font-weight: 500; transition: color 0.2s;">Inicia sesión aquí</a>
      </p>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const authHeaderTitle = document.querySelector('.auth-header p');
    const submitBtn = document.getElementById('submitBtn');
    const footerLogin = document.getElementById('footerLogin');
    const footerSignup = document.getElementById('footerSignup');

    let isLoginMode = true;

    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard.html';
    }

    function setMode(loginMode) {
      isLoginMode = loginMode;

      if (isLoginMode) {
        authHeaderTitle.textContent = 'Inicio de Sesión';
        submitBtn.textContent = 'Ingresar al Sistema';
        footerLogin.style.display = '';
        footerSignup.style.display = 'none';
      } else {
        authHeaderTitle.textContent = 'Crear Cuenta';
        submitBtn.textContent = 'Registrarse';
        footerLogin.style.display = 'none';
        footerSignup.style.display = '';
      }

      alertBox.style.display = 'none';
      alertBox.textContent = '';
      alertBox.className = 'alert';
    }

    document.getElementById('toSignupLink').addEventListener('click', (e) => {
      e.preventDefault();
      setMode(false);
    });

    document.getElementById('toLoginLink').addEventListener('click', (e) => {
      e.preventDefault();
      setMode(true);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = submitBtn;

      if (!email || !password) {
        alertBox.textContent = 'Por favor completa todos los campos.';
        alertBox.className = 'alert error';
        alertBox.style.display = '';
        return;
      }

      btn.textContent = isLoginMode ? 'Verificando...' : 'Creando Cuenta...';
      btn.disabled = true;

      const endpoint = isLoginMode ? '/api/login' : '/api/signup';
      console.log('Enviando a:', endpoint, '| Modo login:', isLoginMode);

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          alertBox.textContent = data.error || 'Error en la operación';
          alertBox.className = 'alert error';
          alertBox.style.display = '';
          btn.textContent = isLoginMode ? 'Ingresar al Sistema' : 'Registrarse';
          btn.disabled = false;
        } else {
          alertBox.textContent = data.message || (isLoginMode ? 'Autenticación exitosa. Redirigiendo...' : 'Registro exitoso. Redirigiendo...');
          alertBox.className = 'alert success';
          alertBox.style.display = '';
          
          // Guardar el token si no es un registro con confirmación pendiente
          if (isLoginMode || (data.token && !data.token.startsWith('token-temp-'))) {
            localStorage.setItem('token', data.token);
            setTimeout(() => {
              window.location.href = '/dashboard.html';
            }, 1000);
          } else {
            // Caso donde requiere confirmación de correo
            btn.textContent = 'Registrarse';
            btn.disabled = false;
          }
        }
      } catch (error) {
        alertBox.textContent = 'Error de conexión con el servidor.';
        alertBox.className = 'alert error';
        alertBox.style.display = '';
        btn.textContent = isLoginMode ? 'Ingresar al Sistema' : 'Registrarse';
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>

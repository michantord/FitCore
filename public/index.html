<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitCore | Login Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glass-panel">
    <div class="auth-header">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </div>
      <h1>Fit<span>Core</span></h1>
      <p>Panel de Administración Seguro</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" required placeholder="admin@fitcore.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña (Backend Validated)</label>
        <input type="password" id="password" class="form-control" required placeholder="Min 8 chars, 1 num, 1 especial" autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Ingresar al Sistema</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');

    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = form.querySelector('.btn');
      
      btn.textContent = 'Verificando...';
      btn.disabled = true;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          alertBox.textContent = data.error || 'Error de autenticación';
          alertBox.className = 'alert error';
          btn.textContent = 'Ingresar al Sistema';
          btn.disabled = false;
        } else {
          alertBox.textContent = 'Autenticación exitosa. Redirigiendo...';
          alertBox.className = 'alert success';
          localStorage.setItem('token', data.token);
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1000);
        }
      } catch (error) {
        alertBox.textContent = 'Error de conexión con el servidor.';
        alertBox.className = 'alert error';
        btn.textContent = 'Ingresar al Sistema';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>

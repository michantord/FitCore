<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitCore | Dashboard Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
  <div class="panel dashboard-panel">
    <div class="dashboard-header">
      <h2>Crear Ejercicio Core</h2>
      <button id="logoutBtn" class="btn-ghost">Cerrar Sesión</button>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="exerciseForm">
      <div class="form-group">
        <label for="exerciseName">Nombre del Ejercicio</label>
        <input type="text" id="exerciseName" class="form-control" required placeholder="Ej. Press de Banca Inclinado">
      </div>

      <div class="form-group">
        <label for="muscleGroup">Grupo Muscular Principal</label>
        <select id="muscleGroup" class="form-control" required>
          <option value="">Cargando Grupos Musculares...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="specificMuscle">Músculo Específico Objetivo</label>
        <select id="specificMuscle" class="form-control" required disabled>
          <option value="">Primero selecciona un Grupo Muscular</option>
        </select>
      </div>

      <button type="submit" class="btn">Registrar Ejercicio</button>
    </form>
  </div>

  <div class="panel dashboard-panel" style="margin-top: 2rem;">
    <div class="dashboard-header">
      <h2>Ejercicios Registrados</h2>
    </div>
    <div id="exercisesList" class="exercises-list">
      <p style="color: var(--c-muted); font-size: 14px;">Cargando ejercicios...</p>
    </div>
  </div>

  <script>
    if (!localStorage.getItem('token')) {
      window.location.href = '/index.html';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = '/index.html';
    });

    const groupSelect = document.getElementById('muscleGroup');
    const muscleSelect = document.getElementById('specificMuscle');
    const alertBox = document.getElementById('alertBox');
    const form = document.getElementById('exerciseForm');

    async function loadGroups() {
      try {
        const res = await fetch('/api/muscle-groups');
        const groups = await res.json();
        
        groupSelect.innerHTML = '<option value="">-- Selecciona un Grupo Muscular --</option>';
        groups.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g.id;
          opt.textContent = g.name;
          groupSelect.appendChild(opt);
        });
      } catch (err) {
        console.error('Error cargando grupos:', err);
      }
    }

    groupSelect.addEventListener('change', async (e) => {
      const groupId = e.target.value;
      
      if (!groupId) {
        muscleSelect.innerHTML = '<option value="">Primero selecciona un Grupo Muscular</option>';
        muscleSelect.disabled = true;
        return;
      }

      muscleSelect.innerHTML = '<option value="">Cargando Músculos...</option>';
      muscleSelect.disabled = true;

      try {
        const res = await fetch(`/api/muscles/${groupId}`);
        const muscles = await res.json();
        
        muscleSelect.innerHTML = '<option value="">-- Selecciona un Músculo Objetivo --</option>';
        muscles.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name;
          muscleSelect.appendChild(opt);
        });
        muscleSelect.disabled = false;
      } catch (err) {
        console.error('Error cargando músculos:', err);
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('exerciseName').value;
      const groupId = document.getElementById('muscleGroup').value;
      const muscleId = document.getElementById('specificMuscle').value;

      try {
        const res = await fetch('/api/exercises', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, groupId, muscleId })
        });
        
        if (res.ok) {
          alertBox.textContent = '¡Ejercicio registrado con éxito en el servidor!';
          alertBox.className = 'alert success';
          alertBox.style.display = 'block';
          
          form.reset();
          muscleSelect.innerHTML = '<option value="">Primero selecciona un Grupo Muscular</option>';
          muscleSelect.disabled = true;
          
          setTimeout(() => {
            alertBox.style.display = 'none';
            alertBox.className = 'alert';
          }, 3000);
          
          loadExercises();
        }
      } catch(err) {
        console.error('Error guardando el ejercicio', err);
      }
    });

    async function loadExercises() {
      try {
        const res = await fetch('/api/exercises');
        const exercises = await res.json();
        const listDiv = document.getElementById('exercisesList');
        
        if (exercises.length === 0) {
          listDiv.innerHTML = '<p style="color: var(--c-muted); font-size: 14px;">No hay ejercicios registrados todavía.</p>';
          return;
        }

        listDiv.innerHTML = exercises.map(ex => `
          <div class="exercise-card">
            <div class="exercise-title">${ex.name}</div>
            <div class="exercise-meta">
              <span class="badge badge-volt">${ex.groupName}</span>
              <span class="badge badge-info">${ex.muscleName}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error cargando la lista de ejercicios:', err);
      }
    }

    loadGroups();
    loadExercises();
  </script>
</body>
</html>

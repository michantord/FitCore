<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitCore | Dashboard Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
  <div class="glass-panel dashboard-panel">
    <div class="dashboard-header">
      <h2>Crear Ejercicio Core</h2>
      <button id="logoutBtn" class="btn-danger">Cerrar Sesión</button>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="exerciseForm">
      <div class="form-group">
        <label for="exerciseName">Nombre del Ejercicio</label>
        <input type="text" id="exerciseName" class="form-control" required placeholder="Ej. Press de Banca Inclinado">
      </div>

      <div class="form-group">
        <label for="muscleGroup">Grupo Muscular Principal</label>
        <select id="muscleGroup" class="form-control" required>
          <option value="">Cargando Grupos Musculares...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="specificMuscle">Músculo Específico Objetivo</label>
        <select id="specificMuscle" class="form-control" required disabled>
          <option value="">Primero selecciona un Grupo Muscular</option>
        </select>
      </div>

      <button type="submit" class="btn">Registrar Ejercicio</button>
    </form>
  </div>

  <script>
    if (!localStorage.getItem('token')) {
      window.location.href = '/index.html';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = '/index.html';
    });

    const groupSelect = document.getElementById('muscleGroup');
    const muscleSelect = document.getElementById('specificMuscle');
    const alertBox = document.getElementById('alertBox');
    const form = document.getElementById('exerciseForm');

    async function loadGroups() {
      try {
        const res = await fetch('/api/muscle-groups');
        const groups = await res.json();
        
        groupSelect.innerHTML = '<option value="">-- Selecciona un Grupo Muscular --</option>';
        groups.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g.id;
          opt.textContent = g.name;
          groupSelect.appendChild(opt);
        });
      } catch (err) {
        console.error('Error cargando grupos:', err);
      }
    }

    groupSelect.addEventListener('change', async (e) => {
      const groupId = e.target.value;
      
      if (!groupId) {
        muscleSelect.innerHTML = '<option value="">Primero selecciona un Grupo Muscular</option>';
        muscleSelect.disabled = true;
        return;
      }

      muscleSelect.innerHTML = '<option value="">Cargando Músculos...</option>';
      muscleSelect.disabled = true;

      try {
        const res = await fetch(`/api/muscles/${groupId}`);
        const muscles = await res.json();
        
        muscleSelect.innerHTML = '<option value="">-- Selecciona un Músculo Objetivo --</option>';
        muscles.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name;
          muscleSelect.appendChild(opt);
        });
        muscleSelect.disabled = false;
      } catch (err) {
        console.error('Error cargando músculos:', err);
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      alertBox.textContent = '¡Ejercicio registrado con éxito en la Base de Datos!';
      alertBox.className = 'alert success';
      alertBox.style.display = 'block';
      
      form.reset();
      muscleSelect.innerHTML = '<option value="">Primero selecciona un Grupo Muscular</option>';
      muscleSelect.disabled = true;
      
      setTimeout(() => {
        alertBox.style.display = 'none';
        alertBox.className = 'alert';
      }, 3000);
    });

    loadGroups();
  </script>
</body>
</html>
